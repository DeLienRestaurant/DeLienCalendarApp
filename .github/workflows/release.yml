name: Release Desktop App

# アプリ配布用リポジトリ（DeLienCalendarApp）の .github/workflows/release.yml に置いて使います。
# このファイルは DeLienCalender リポジトリの同期対象外です
# （同期は src/・installer/ などを上書きするだけで .github/ は保持します）。
#
# 使い方:
#   1) タグ push でリリース:  git tag v0.1.0 && git push origin v0.1.0
#   2) 手動実行（Actions > Release Desktop App > Run workflow）でバージョンを入力
#
# 出力:
#   - DeLienCalendar-<version>-setup.exe  … インストーラ（インストール先を選択可能）
#   - DeLienCalendar-win-x64.zip          … ポータブル版
#   - SHA256SUMS.txt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（例: 0.2.0）'
        required: false
        type: string
      prerelease:
        description: 'プレリリースとして公開する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT: src/DeLienCalendar.Desktop/DeLienCalendar.Desktop.csproj

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Determine version
        id: version
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'

          if ($eventName -eq 'push') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          elseif ('${{ inputs.version }}' -ne '') {
            $version = '${{ inputs.version }}'.TrimStart('v')
          }
          else {
            [xml]$csproj = Get-Content -LiteralPath '${{ env.PROJECT }}'
            $version = @($csproj.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'バージョンを決定できませんでした。workflow_dispatch で version を指定してください。'
          }

          [xml]$csprojCheck = Get-Content -LiteralPath '${{ env.PROJECT }}'
          $csprojVersion = @($csprojCheck.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          if ($csprojVersion -and $csprojVersion -ne $version) {
            Write-Host "::warning::タグ/入力 ($version) と csproj の Version ($csprojVersion) が一致しません。"
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"  >> $env:GITHUB_OUTPUT
          Write-Host "リリースバージョン: v$version"

      - name: 3. Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 4. Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup のインストールに失敗しました。' }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw 'ISCC.exe が見つかりません。'
          }

      - name: 5. Build ZIP and installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 -Configuration Release -Version $env:VERSION -WithInstaller
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: 6. Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-ChildItem dist -File -Include '*.zip', '*-setup.exe' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding ascii -Append

      - name: 7. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DeLien Calendar ${{ steps.version.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          body: |
            ## インストール

            下の `DeLienCalendar-${{ steps.version.outputs.value }}-setup.exe` を実行し、
            ウィザードに従ってください（インストール先は自由に指定できます／管理者権限不要）。

            コマンドラインから入れる場合:

            ```powershell
            .\DeLienCalendar-${{ steps.version.outputs.value }}-setup.exe /VERYSILENT /DIR="D:\Apps\DeLienCalendar"
            ```

            **動作要件**: Windows 10 1809 以降 / Windows 11、[.NET 8 デスクトップランタイム](https://dotnet.microsoft.com/download/dotnet/8.0)、WebView2 ランタイム

            ### ポータブル版

            インストーラを使わない場合は `DeLienCalendar-win-x64.zip` を展開し、
            そのまま `DeLienCalendar.exe` を実行してください。

            > このビルドはコード署名を行っていないため、SmartScreen の警告が表示される場合があります。
            > 配布元がこのリポジトリであることを確認したうえで「詳細情報」→「実行」を選択してください。
            > 詳細は SECURITY.md を参照してください。

            `SHA256SUMS.txt` でダウンロードしたファイルを検証できます。
          files: |
            dist/DeLienCalendar-*-setup.exe
            dist/DeLienCalendar-win-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
